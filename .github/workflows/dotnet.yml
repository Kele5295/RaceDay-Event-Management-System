name: RaceDay API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Part2/RaceDay.API/RaceDay.API.slnx

      - name: Build
        run: dotnet build Part2/RaceDay.API/RaceDay.API.slnx --configuration Release --no-restore

      - name: Run automated tests
        run: dotnet test Part2/RaceDay.API/RaceDay.API.slnx --configuration Release --no-build --logger trx --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore